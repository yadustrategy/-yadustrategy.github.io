<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yadu Strategy Advisory Services | Institutional Policy & Sovereign Risk Advisory</title>
  <meta name="description" content="Independent, principal-led counsel to corporate boards, global investors, and select market challengers navigating sovereign risk, regulatory bottlenecks, and institutional governance." />

  <!-- Royal Institutional & Editorial Typography -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy-royal: #06101E;
      --navy-elevated: #0B192E;
      --navy-card: #0E203A;
      --white-royal: #FFFFFF;
      --white-soft: #E6EAF0;
      --white-muted: #B2BDD0;
      --gold-leaf: #D4AF37;
      --gold-metallic: #E8CC75;
      --gold-border: rgba(212, 175, 55, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--navy-royal);
      color: var(--white-royal);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--white-royal);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* Top Sovereign Ribbon */
    .top-bar {
      background-color: #030912;
      color: var(--gold-metallic);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--gold-border);
      font-weight: 500;
    }

    /* Header & Bespoke Walnut-Gold Wazeer Emblem */
    header {
      padding: 54px 0 42px;
      text-align: center;
      border-bottom: 1px solid var(--gold-border);
      background: radial-gradient(circle at top, #102544 0%, var(--navy-royal) 76%);
    }

    .wazeer-emblem-wrap {
      display: inline-block;
      margin-bottom: 12px;
    }

    .wazeer-svg {
      width: 146px;
      height: auto;
      display: block;
      margin: 0 auto 16px;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.78));
    }

    .brand-wordmark {
      font-family: 'Cinzel', Georgia, serif;
      font-size: clamp(1.65rem, 3.6vw, 2.25rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--white-royal);
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .brand-submark {
      font-family: 'Inter', sans-serif;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--gold-metallic);
      margin-bottom: 18px;
    }

    .header-divider {
      width: 110px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-leaf), transparent);
      margin: 0 auto 16px;
    }

    .header-tagline {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold-leaf);
      font-weight: 600;
    }

    /* Block 1: The Mandate (Hero) */
    .hero {
      padding: 78px 0 84px;
      text-align: center;
      border-bottom: 1px solid var(--gold-border);
    }

    .hero h1 {
      font-size: clamp(2.45rem, 4.7vw, 3.6rem);
      line-height: 1.14;
      margin-bottom: 24px;
      color: var(--white-royal);
    }

    .hero p {
      max-width: 740px;
      margin: 0 auto 40px;
      font-size: 1.07rem;
      color: var(--white-soft);
      font-weight: 300;
    }

    .cta-btn {
      display: inline-block;
      background-color: transparent;
      color: var(--gold-metallic);
      text-decoration: none;
      padding: 17px 38px;
      font-size: 0.81rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border: 1.5px solid var(--gold-leaf);
      cursor: pointer;
      transition: all 0.28s ease;
    }

    .cta-btn:hover {
      background-color: var(--gold-leaf);
      color: var(--navy-royal);
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.38);
    }

    .cta-subnote {
      display: block;
      margin-top: 16px;
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: var(--white-muted);
    }

    /* Block 2: Practice, ABAC & Ethical Doctrine */
    .section {
      padding: 78px 0;
      border-bottom: 1px solid var(--gold-border);
    }

    .section-eyebrow {
      font-size: 0.74rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-leaf);
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
    }

    .section h2 {
      font-size: clamp(2rem, 3.4vw, 2.65rem);
      margin-bottom: 20px;
      color: var(--white-royal);
    }

    .lead-text {
      font-size: 1.03rem;
      color: var(--white-soft);
      margin-bottom: 46px;
      max-width: 840px;
      font-weight: 300;
    }

    .doctrine-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .doctrine-card {
      background-color: var(--navy-card);
      border: 1px solid var(--gold-border);
      border-left: 3px solid var(--gold-leaf);
      padding: 32px 36px;
    }

    .doctrine-card h3 {
      font-size: 1.52rem;
      margin-bottom: 10px;
      color: var(--gold-metallic);
    }

    .doctrine-card p {
      font-size: 0.96rem;
      color: var(--white-soft);
      font-weight: 300;
    }

    .gates-list {
      margin-top: 16px;
      padding-left: 22px;
      color: var(--white-royal);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .gates-list li {
      margin-bottom: 8px;
    }

    .gates-list li::marker {
      color: var(--gold-leaf);
      font-weight: 700;
    }

    /* Block 3: Principal Leadership & Executive Directory */
    .principal-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: start;
    }

    .principal-name {
      font-size: 2.35rem;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      color: var(--white-royal);
    }

    .principal-title {
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-leaf);
      font-weight: 600;
      margin-bottom: 24px;
      display: block;
    }

    .principal-bio {
      font-size: 0.99rem;
      color: var(--white-soft);
      margin-bottom: 18px;
      font-weight: 300;
    }

    .directory-box {
      background-color: var(--navy-elevated);
      color: var(--white-royal);
      padding: 36px;
      border: 1px solid var(--gold-border);
      border-top: 3px solid var(--gold-leaf);
    }

    .directory-box h3 {
      color: var(--gold-metallic);
      font-size: 1.48rem;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gold-border);
    }

    .dir-item {
      margin-bottom: 18px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--white-soft);
    }

    .dir-item:last-child {
      margin-bottom: 0;
    }

    .dir-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--gold-leaf);
      margin-bottom: 4px;
      font-weight: 600;
    }

    .dir-item a {
      color: var(--white-royal);
      text-decoration: none;
      border-bottom: 1px solid var(--gold-leaf);
      transition: color 0.2s ease;
    }

    .dir-item a:hover {
      color: var(--gold-metallic);
    }

    /* Footer & Regulatory Boundary */
    footer {
      padding: 48px 0 68px;
      font-size: 0.82rem;
      color: var(--white-muted);
      background-color: #030912;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--gold-border);
      color: var(--white-royal);
      font-weight: 500;
    }

    .footer-top span:last-child {
      color: var(--gold-metallic);
    }

    .regulatory-notice {
      font-size: 0.79rem;
      line-height: 1.7;
      color: var(--white-muted);
      font-weight: 300;
    }

    .regulatory-notice strong {
      color: var(--gold-metallic);
      font-weight: 600;
    }

    /* Pre-Screening Modal (Royal Navy & Gold) */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 16, 0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-panel {
      background: var(--navy-elevated);
      max-width: 530px;
      width: 100%;
      padding: 38px;
      border: 1px solid var(--gold-border);
      border-top: 4px solid var(--gold-leaf);
      position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--gold-metallic);
    }

    .modal-panel h3 {
      font-size: 1.72rem;
      margin-bottom: 10px;
      color: var(--white-royal);
    }

    .modal-warning {
      background: rgba(212, 175, 55, 0.08);
      border-left: 3px solid var(--gold-leaf);
      padding: 12px 14px;
      font-size: 0.81rem;
      color: var(--white-soft);
      margin: 16px 0 22px;
    }

    .modal-warning strong {
      color: var(--gold-metallic);
    }

      margin-bottom: 18px;
