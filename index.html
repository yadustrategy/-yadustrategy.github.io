<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yadu Strategy Advisory Services | Institutional Policy & Sovereign Risk Advisory</title>
  <meta name="description" content="Independent, principal-led counsel to corporate boards, global investors, and select market challengers navigating sovereign risk, regulatory bottlenecks, and institutional governance." />

  <style>
    :root {
      --navy-royal: #06101E;
      --navy-elevated: #0B192E;
      --navy-card: #0E203A;
      --white-royal: #FFFFFF;
      --white-soft: #E6EAF0;
      --white-muted: #B2BDD0;
      --gold-leaf: #D4AF37;
      --gold-metallic: #E8CC75;
      --gold-border: rgba(212, 175, 55, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: #06101E;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .serif {
      font-family: "Didot", "Bodoni MT", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      color: #FFFFFF;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* Top Sovereign Ribbon */
    .top-bar {
      background-color: #030912;
      color: #E8CC75;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      font-weight: 500;
    }

    /* Header & Bespoke Walnut-Gold Wazeer Emblem */
    header {
      padding: 54px 0 42px;
      text-align: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      background: radial-gradient(circle at top, #102544 0%, #06101E 76%);
    }

    .wazeer-emblem-wrap {
      display: inline-block;
      margin-bottom: 12px;
    }

    .wazeer-svg {
      width: 146px;
      height: auto;
      display: block;
      margin: 0 auto 16px;
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.78));
    }

    .brand-wordmark {
      font-family: "Cinzel", "Trajan Pro", "Didot", "Palatino Linotype", Georgia, serif;
      font-size: clamp(1.65rem, 3.6vw, 2.25rem);
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #FFFFFF;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .brand-submark {
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #E8CC75;
      margin-bottom: 18px;
    }

    .header-divider {
      width: 110px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #D4AF37, transparent);
      margin: 0 auto 16px;
    }

    .header-tagline {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #D4AF37;
      font-weight: 600;
    }

    /* Block 1: The Mandate (Hero) */
    .hero {
      padding: 78px 0 84px;
      text-align: center;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
    }

    .hero h1 {
      font-size: clamp(2.35rem, 4.7vw, 3.5rem);
      line-height: 1.15;
      margin-bottom: 24px;
      color: #FFFFFF;
    }

    .hero p {
      max-width: 740px;
      margin: 0 auto 40px;
      font-size: 1.06rem;
      color: #E6EAF0;
      font-weight: 300;
    }

    .cta-btn {
      display: inline-block;
      background-color: transparent;
      color: #E8CC75;
      text-decoration: none;
      padding: 17px 36px;
      font-size: 0.81rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border: 1.5px solid #D4AF37;
      cursor: pointer;
      transition: all 0.28s ease;
    }

    .cta-btn:hover {
      background-color: #D4AF37;
      color: #06101E;
      box-shadow: 0 0 28px rgba(212, 175, 55, 0.38);
    }

    .cta-subnote {
      display: block;
      margin-top: 16px;
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      color: #B2BDD0;
    }

    /* Block 2: Practice, ABAC & Ethical Doctrine */
    .section {
      padding: 78px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
    }

    .section-eyebrow {
      font-size: 0.74rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #D4AF37;
      font-weight: 600;
      margin-bottom: 10px;
      display: block;
    }

    .section h2 {
      font-size: clamp(1.95rem, 3.4vw, 2.6rem);
      margin-bottom: 20px;
      color: #FFFFFF;
    }

    .lead-text {
      font-size: 1.03rem;
      color: #E6EAF0;
      margin-bottom: 46px;
      max-width: 840px;
      font-weight: 300;
    }

    .doctrine-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    .doctrine-card {
      background-color: #0E203A;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-left: 3px solid #D4AF37;
      padding: 32px 36px;
    }

    .doctrine-card h3 {
      font-size: 1.48rem;
      margin-bottom: 10px;
      color: #E8CC75;
    }

    .doctrine-card p {
      font-size: 0.96rem;
      color: #E6EAF0;
      font-weight: 300;
    }

    .gates-list {
      margin-top: 16px;
      padding-left: 22px;
      color: #FFFFFF;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .gates-list li {
      margin-bottom: 8px;
    }

    .gates-list li::marker {
      color: #D4AF37;
      font-weight: 700;
    }

    /* Block 3: Principal Leadership & Executive Directory */
    .principal-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 48px;
      align-items: start;
    }

    .principal-name {
      font-size: 2.3rem;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      color: #FFFFFF;
    }

    .principal-title {
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #D4AF37;
      font-weight: 600;
      margin-bottom: 24px;
      display: block;
    }

    .principal-bio {
      font-size: 0.99rem;
      color: #E6EAF0;
      margin-bottom: 18px;
      font-weight: 300;
    }

    .directory-box {
      background-color: #0B192E;
      color: #FFFFFF;
      padding: 36px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-top: 3px solid #D4AF37;
    }

    .directory-box h3 {
      color: #E8CC75;
      font-size: 1.45rem;
      margin-bottom: 22px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
    }

    .dir-item {
      margin-bottom: 18px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #E6EAF0;
    }

    .dir-item:last-child {
      margin-bottom: 0;
    }

    .dir-label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #D4AF37;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .dir-item a {
      color: #FFFFFF;
      text-decoration: none;
      border-bottom: 1px solid #D4AF37;
    }

    /* Footer & Regulatory Boundary */
    footer {
      padding: 48px 0 68px;
      font-size: 0.82rem;
      color: #B2BDD0;
      background-color: #030912;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.35);
      color: #FFFFFF;
      font-weight: 500;
    }

    .footer-top span:last-child {
      color: #E8CC75;
    }

    .regulatory-notice {
      font-size: 0.79rem;
      line-height: 1.7;
      color: #B2BDD0;
      font-weight: 300;
    }

    .regulatory-notice strong {
      color: #E8CC75;
      font-weight: 600;
    }

    /* Pre-Screening Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 8, 16, 0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-panel {
      background: #0B192E;
      max-width: 530px;
      width: 100%;
      padding: 38px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-top: 4px solid #D4AF37;
      position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: #E8CC75;
    }

    .modal-panel h3 {
      font-size: 1.7rem;
      margin-bottom: 10px;
      color: #FFFFFF;
    }

    .modal-warning {
      background: rgba(212, 175, 55, 0.08);
      border-left: 3px solid #D4AF37;
      padding: 12px 14px;
      font-size: 0.81rem;
      color: #E6EAF0;
      margin: 16px 0 22px;
    }

    .modal-warning strong {
      color: #E8CC75;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #E8CC75;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      font-family: inherit;
      font-size: 0.92rem;
      background: #06101E;
      color: #FFFFFF;
    }

    @media (max-width: 768px) {
      .principal-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
      .hero {
        padding: 56px 0;
      }
      .section {
        padding: 56px 0;
      }
      .doctrine-card {
        padding: 24px 22px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Sovereign Ribbon -->
  <div class="top-bar">
